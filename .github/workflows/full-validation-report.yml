name: Full validation report

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run containing the 40 completed validation artifacts
        required: true
        default: '37350550654'
  push:
    branches: [feat/policy-diagnostics]
    paths:
      - .github/workflows/full-validation-report.yml

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: vars.BENCHMARK_ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '37350550654' }}
          pattern: validation-*
          path: collected
      - name: Validate and report existing simulations
        run: |
          python3 -m venv /tmp/report-env
          /tmp/report-env/bin/pip install matplotlib
          /tmp/report-env/bin/python benchmarks/scripts/assemble_validation.py collected --out report
          echo 'Validated all 4760 simulations. Download full-validation-report for all-five-seed and held-out-seed results. No simulations were rerun.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-validation-report
          path: |
            report/
            collected/
          retention-days: 1
