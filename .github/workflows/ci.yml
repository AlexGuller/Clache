name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,     build_type: Debug }
          - { os: ubuntu-24.04, compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,     build_type: Release }
          - { os: ubuntu-24.04, compiler: clang-17, cc: clang-17, cxx: clang++-17, build_type: Debug }
          - { os: ubuntu-24.04, compiler: clang-17, cc: clang-17, cxx: clang++-17, build_type: Release }
          - { os: macos-14,     compiler: appleclang, cc: clang, cxx: clang++,     build_type: Release }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCLACHE_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    name: sanitize / ${{ matrix.sanitize }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["address,undefined", "thread"]
    env:
      CC: clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCLACHE_WERROR=ON
          -DCLACHE_BUILD_BENCHMARKS=OFF
          "-DCLACHE_SANITIZE=${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.cpp')
          if [ -n "$files" ]; then clang-format-18 --dry-run --Werror $files; fi
