name: Policy diagnostics
on:
  workflow_dispatch:
  push:
    branches: [feat/policy-diagnostics]
    paths:
      - .github/workflows/policy-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: policy-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: vars.BENCHMARK_ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCLACHE_BUILD_TESTS=OFF -DCLACHE_BUILD_BENCHMARKS=OFF -DCLACHE_WERROR=ON
          cmake --build build/release --parallel 2
          tar -czf executables.tar.gz -C build/release apps/clache_sim apps/clache_tracegen CMakeCache.txt
      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: executables.tar.gz
          retention-days: 1
  diagnose:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        workload: [zipf, cost_inversion, variable_size, scan, hotset_shift, burst, regional_split, mixed]
        seed: [1]
    env:
      WORKLOAD: ${{ matrix.workload }}
      TRACE_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: executables
      - name: Prepare
        run: |
          mkdir -p build/release
          tar -xzf executables.tar.gz -C build/release
      - name: Run diagnostic cases
        run: |
          python3 benchmarks/scripts/run_diagnostics.py --workload "$WORKLOAD" --seed "$TRACE_SEED"
          cp build/release/CMakeCache.txt diagnostics/
          lscpu > diagnostics/cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.workload }}-${{ matrix.seed }}
          path: diagnostics/
          retention-days: 1
